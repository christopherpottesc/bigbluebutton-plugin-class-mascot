<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1088" role="img" aria-labelledby="title">
  <title id="title">Mascote da turma evoluindo com a participação</title>
  <!-- Placeholder illustration for the settings panel; replace with the final art (1920x1088). -->
  <rect x="160" y="64" width="1600" height="960" rx="96" fill="#102133"/>
  <circle cx="1460" cy="300" r="180" fill="#00595e" opacity="0.6"/>
  <circle cx="420" cy="820" r="140" fill="#3b4a5b" opacity="0.7"/>

  <!-- Level bars growing from left to right -->
  <g fill="#008c95">
    <rect x="420" y="700" width="90" height="120" rx="20"/>
    <rect x="560" y="640" width="90" height="180" rx="20"/>
    <rect x="700" y="570" width="90" height="250" rx="20"/>
    <rect x="840" y="490" width="90" height="330" rx="20"/>
  </g>
  <rect x="980" y="400" width="90" height="420" rx="20" fill="#86eff5"/>

  <!-- Stylised mascot head on top of the tallest bar -->
